<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>REAL AI SERVER</title>

    <style>
        body {
            margin: 0;
            background: #080b12;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 80px auto;
            padding: 25px;
        }

        h1 {
            color: #00eaff;
        }

        .status {
            color: #00ff88;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 130px;
            background: #111722;
            color: white;
            border: 1px solid #263044;
            border-radius: 10px;
            padding: 15px;
            box-sizing: border-box;
            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 13px 25px;
            border: 0;
            border-radius: 8px;
            background: #00eaff;
            color: #001018;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #00ff88;
        }

        #response {
            margin-top: 25px;
            padding: 20px;
            background: #111722;
            border-radius: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>REAL AI SERVER</h1>

    <div class="status">
        ● AI Server Interface
    </div>

    <textarea
        id="message"
        placeholder="Write something to the AI..."
    ></textarea>

    <br>

    <button onclick="sendMessage()">
        SEND
    </button>

    <div id="response">
        Response will appear here...
    </div>

</div>


<script>

async function sendMessage() {

    const message = document.getElementById("message").value;

    const responseBox = document.getElementById("response");

    if (!message.trim()) {
        responseBox.textContent = "Write a message first.";
        return;
    }

    responseBox.textContent = "Processing...";

    try {

        const response = await fetch(
            "http://localhost:5000/api/process",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    text: message
                })
            }
        );

        const data = await response.json();

        responseBox.textContent =
            JSON.stringify(data, null, 2);

    } catch (error) {

        responseBox.textContent =
            "ERROR: Cannot connect to AI server.\n\n" +
            error;

    }
}

</script>

</body>
</html>
